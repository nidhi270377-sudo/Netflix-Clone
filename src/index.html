<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <header><h2>Netflix</h2></header>
    <span>
      <form>
        <select name="Choose Language" id="select1">
        <option class="bi bi-translate" value="English">English</option>
        <option value="Hindi">Hindi</option>
        </select>
      </form>
    </span>
    <span>
      <button>Sign In</button>
    </span>
  </div>

  <div>
    <h1>More watching. Less scrolling.</h1>
    <h5>Starts at ₹149. Cancel at any time.</h5>
    <h6>Ready to watch? Enter your email to create or restart your membership.</h6>
  </div>

  <div>
    <input type="text" id="email" placeholder="Email address">
    <span><button>Get Started</button></span>

  </div>
</body>
</html>
